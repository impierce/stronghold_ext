[package]
name = "stronghold_ext"
version = "0.1.0"
edition = "2021"
authors = ["<Tensor>", "<tensordeveloper@gmail.com>"]

[features]
# RS256 is deliberately not a default: it pulls in the `rsa` crate, which carries
# RUSTSEC-2023-0071 (Marvin attack) with no patched release available. Consumers
# that only need the EC algorithms should not inherit that advisory, so RS256 is
# opt-in via `features = ["rs256"]`.
default = ["es256", "es256k"]

es256 = ["_crypto_base", "_ec_base", "dep:p256"]
es256k = ["_crypto_base", "_ec_base", "dep:k256"]
rs256 = ["_crypto_base", "dep:rand", "dep:rsa"]

# Internal: machinery shared by every algorithm. Not meant to be enabled directly.
_crypto_base = [
    "dep:stronghold-utils",
    "dep:stronghold_engine",
    "dep:serde",
    "dep:zeroize",
]

# Internal: dependencies shared by the EC algorithms. RS256 uses the `sha2` and `signature`
# versions re-exported by `rsa` instead.
_ec_base = ["dep:ecdsa", "dep:sha2", "dep:signature"]

[dependencies]
thiserror = "1.0"
iota_stronghold = "2.1"
stronghold-utils = { version = "1.0", optional = true }
stronghold_engine = { version = "2.0", optional = true }

p256 = { version = "0.14", optional = true, features = ["ecdsa", "getrandom"] }
k256 = { version = "0.14", optional = true, features = ["ecdsa", "getrandom"] }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
ecdsa = { version = "0.17", optional = true }
signature = { version = "3", optional = true }
rand = { version = "0.8", optional = true }
sha2 = { version = "0.11", optional = true }
zeroize = { version = "1.5.7", default-features = false, features = [
    "zeroize_derive",
], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
hex = "0.4"
stronghold_ext = { path = ".", default-features = false, features = ["rs256"] }
